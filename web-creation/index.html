<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>R1 Roku Remote</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main id="app">
        <section class="top">
            <div>
                <h1>R1 Roku</h1>
                <p id="status">Set a Roku IP</p>
            </div>
            <button id="settingsBtn" class="icon-button" aria-label="Settings">...</button>
        </section>

        <section id="settings" class="settings hidden">
            <label>
                Roku IP
                <input id="rokuIp" inputmode="decimal" placeholder="192.168.1.45">
            </label>
            <label>
                Bridge URL
                <input id="bridgeUrl" inputmode="url" placeholder="http://192.168.1.10:8787">
            </label>
            <div class="row">
                <button id="saveBtn">Save</button>
                <button id="discoverBtn">Find</button>
            </div>
            <div id="devices"></div>
            <div class="keyboard">
                <input id="textInput" placeholder="type text">
                <button id="sendTextBtn">Send</button>
            </div>
        </section>

        <section class="remote" id="remote">
            <button data-key="Home">Home</button>
            <button data-key="Back">Back</button>
            <button data-key="PowerOff">Power</button>

            <span></span>
            <button data-key="Up">Up</button>
            <span></span>

            <button data-key="Left">Left</button>
            <button data-key="Select" class="ok">OK</button>
            <button data-key="Right">Right</button>

            <span></span>
            <button data-key="Down">Down</button>
            <span></span>

            <button data-key="Rev">Rev</button>
            <button data-key="Play">Play</button>
            <button data-key="Fwd">Fwd</button>

            <button data-key="VolumeDown">Vol-</button>
            <button data-key="VolumeMute">Mute</button>
            <button data-key="VolumeUp">Vol+</button>
        </section>
    </main>
    <script src="./js/app.js?v=3"></script>
</body>
</html>
