<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>R1 Roku Remote</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main id="app">
        <section class="status-strip">
            <p id="status">Set a Roku IP</p>
        </section>

        <section class="remote" id="remote">
            <div class="primary-row">
                <button data-key="Back">Back</button>
                <button data-key="Home">Home</button>
                <button class="power-button" data-key="PowerOff" aria-label="Power">Power</button>
            </div>

            <div class="control-stage">
                <div class="dpad" aria-label="Directional pad">
                    <span></span>
                    <button class="dpad-key dpad-up" data-key="Up" aria-label="Up">Up</button>
                    <span></span>

                    <button class="dpad-key dpad-left" data-key="Left" aria-label="Left">Left</button>
                    <button class="dpad-key dpad-ok" data-key="Select" aria-label="Select">OK</button>
                    <button class="dpad-key dpad-right" data-key="Right" aria-label="Right">Right</button>

                    <span></span>
                    <button class="dpad-key dpad-down" data-key="Down" aria-label="Down">Down</button>
                    <span></span>
                </div>

                <div class="volume-panel" aria-label="Volume controls">
                    <strong>VOL</strong>
                    <div class="volume-track">
                        <span>+</span>
                        <div></div>
                        <span>-</span>
                    </div>
                </div>
            </div>

            <div class="primary-row">
                <button class="play-pause" data-key="Play" aria-label="Play/Pause">&#9654;&#10074;&#10074;</button>
                <button data-key="VolumeMute">Mute</button>
                <button id="moreBtn">More</button>
            </div>
        </section>

        <section id="morePanel" class="panel hidden">
            <div class="panel-head">
                <strong>More</strong>
                <button id="closeMoreBtn">Close</button>
            </div>
            <div class="more-grid">
                <button data-key="InstantReplay">Replay</button>
                <button data-key="Rev">Rev</button>
                <button data-key="Fwd">Fwd</button>
                <button data-key="Info">Info</button>
                <button data-key="Search">Search</button>
                <button id="openTextBtn">Text</button>
                <button id="settingsBtn">Setup</button>
                <button id="helpBtn">Help</button>
            </div>
        </section>

        <section id="helpPanel" class="panel hidden">
            <h2>Roku Setup</h2>
            <p>On the TV, open Settings &gt; System &gt; Advanced system settings &gt; Control by mobile apps.</p>
            <p>Set Network access to Enabled. If buttons still fail, use Permissive.</p>
            <button id="closeHelpBtn">Hide</button>
        </section>

        <section id="settings" class="panel settings hidden">
            <div class="panel-head">
                <strong>Setup</strong>
                <button id="closeSettingsBtn">Close</button>
            </div>
            <label>
                Roku IP
                <input id="rokuIp" inputmode="decimal" placeholder="192.168.1.45">
            </label>
            <label>
                Bridge URL
                <input id="bridgeUrl" inputmode="url" placeholder="http://192.168.1.10:8787">
            </label>
            <div class="row">
                <button id="saveBtn">Save</button>
                <button id="discoverBtn">Find</button>
            </div>
            <div id="devices"></div>
            <div class="keyboard">
                <input id="textInput" placeholder="type text">
                <button id="sendTextBtn">Send</button>
            </div>
        </section>

        <section id="textPanel" class="panel text-panel hidden">
            <div class="panel-head">
                <strong>Text</strong>
                <button id="closeTextBtn">Close</button>
            </div>
            <input id="voiceTextInput" placeholder="hold side button or type">
            <div class="row">
                <button id="startVoiceBtn">Voice</button>
                <button id="sendVoiceTextBtn">Send</button>
            </div>
            <p id="voiceStatus">Text sends as you speak or type.</p>
        </section>
    </main>
    <script src="./js/app.js?v=12"></script>
</body>
</html>
