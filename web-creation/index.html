<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>R1 Roku Remote</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main id="app">
        <section class="top">
            <div>
                <h1>Roku</h1>
                <p id="status">Set a Roku IP</p>
            </div>
            <button id="settingsBtn" class="icon-button" aria-label="Settings">...</button>
        </section>

        <section id="settings" class="settings hidden">
            <label>
                Roku IP
                <input id="rokuIp" inputmode="decimal" placeholder="192.168.1.45">
            </label>
            <label>
                Bridge URL
                <input id="bridgeUrl" inputmode="url" placeholder="http://192.168.1.10:8787">
            </label>
            <div class="row">
                <button id="saveBtn">Save</button>
                <button id="discoverBtn">Find</button>
            </div>
            <div id="devices"></div>
            <div class="keyboard">
                <input id="textInput" placeholder="type text">
                <button id="sendTextBtn">Send</button>
            </div>
        </section>

        <section class="remote" id="remote">
            <div class="quick-row">
                <button data-key="Back">Back</button>
                <button data-key="Home">Home</button>
                <button data-key="PowerOff">Power</button>
            </div>

            <div class="control-stage">
                <div class="dpad" aria-label="Directional pad">
                    <button class="dpad-corner dpad-replay" data-key="InstantReplay" aria-label="Replay">Replay</button>
                    <button class="dpad-key dpad-up" data-key="Up" aria-label="Up">Up</button>
                    <button class="dpad-corner dpad-info" data-key="Info" aria-label="Info">Info</button>

                    <button class="dpad-key dpad-left" data-key="Left" aria-label="Left">Left</button>
                    <button class="dpad-key dpad-ok" data-key="Select" aria-label="Select">OK</button>
                    <button class="dpad-key dpad-right" data-key="Right" aria-label="Right">Right</button>

                    <button class="dpad-corner dpad-search" data-key="Search" aria-label="Search">Search</button>
                    <button class="dpad-key dpad-down" data-key="Down" aria-label="Down">Down</button>
                    <button class="dpad-corner dpad-enter" data-key="Enter" aria-label="Enter">Enter</button>
                </div>

                <div class="volume-panel" aria-label="Volume controls">
                    <div class="volume-title">VOL</div>
                    <div class="volume-track">
                        <span>+</span>
                        <div></div>
                        <span>-</span>
                    </div>
                    <button data-key="VolumeMute">Mute</button>
                </div>
            </div>

            <div class="transport-row">
                <button data-key="Rev">Rev</button>
                <button data-key="Play">Play</button>
                <button data-key="Fwd">Fwd</button>
            </div>
        </section>

        <section id="textPanel" class="text-panel hidden">
            <div class="text-panel-head">
                <strong>Text</strong>
                <button id="closeTextBtn" aria-label="Close text entry">Close</button>
            </div>
            <input id="voiceTextInput" placeholder="hold side button or type">
            <div class="row">
                <button id="startVoiceBtn">Voice</button>
                <button id="sendVoiceTextBtn">Send</button>
            </div>
            <p id="voiceStatus">Voice uses browser speech when available.</p>
        </section>
    </main>
    <script src="./js/app.js?v=6"></script>
</body>
</html>
